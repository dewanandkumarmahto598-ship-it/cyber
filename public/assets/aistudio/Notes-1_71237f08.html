<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Notes</title>
<style>
:root{--bg:#faf8f4;--card:#fff;--tx:#18141f;--mu:#7b7587;--ln:#e9e5ee;--ac:#ff3d6e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f0c15;--card:#181421;--tx:#f4f1f9;--mu:#9d97ab;--ln:#2a2535}}
:root[data-theme="dark"]{--bg:#0f0c15;--card:#181421;--tx:#f4f1f9;--mu:#9d97ab;--ln:#2a2535}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 "Avenir Next","Trebuchet MS",Verdana,sans-serif;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:10px 12px;width:100%;outline:none}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);display:flex;justify-content:center;align-items:center;height:48px;border-bottom:1px solid var(--ln);max-width:480px;margin:0 auto}
.logo{font:italic 700 26px Georgia,"Times New Roman",serif;letter-spacing:-.5px;background:linear-gradient(90deg,#ff3d6e,#ff9d2e,#7b2ff7);-webkit-background-clip:text;background-clip:text;color:transparent}
#main{max-width:480px;margin:0 auto;padding-bottom:76px;min-height:70vh}
#nav{position:fixed;bottom:0;left:0;right:0;z-index:9;background:var(--bg);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px)}
#nav div{max-width:480px;margin:0 auto;display:flex}
#nav button{flex:1;height:54px;display:grid;place-items:center;color:var(--mu)}#nav button.on{color:var(--tx)}
.ic{display:inline-grid;place-items:center;width:40px;height:40px}.ic.on{color:var(--ac)}.sv{margin-left:auto}
.av{border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-weight:700;flex:none}
.post{border-bottom:1px solid var(--ln);padding-bottom:10px}
.ph{display:flex;align-items:center;padding:8px 6px 8px 12px}.ph .ic{margin-left:auto}
.who{display:flex;align-items:center;gap:10px}
.nc{position:relative;min-height:280px;padding:28px 24px;display:flex;flex-direction:column;justify-content:center;text-align:center;background:var(--card);border-block:1px solid var(--ln);user-select:none;overflow:hidden}
.nc.g{color:#fff;border:0}
.nc h3{margin:0 0 8px;font-size:24px;line-height:1.2}.nc p{margin:0;font-size:19px;white-space:pre-wrap;word-wrap:break-word}
.hrt{position:absolute;inset:0;display:grid;place-items:center;color:#fff;opacity:0;pointer-events:none}.hrt svg{width:96px;height:96px;filter:drop-shadow(0 2px 8px rgba(0,0,0,.4))}
.pop .hrt{animation:pop .75s}
@keyframes pop{0%{opacity:0;transform:scale(.4)}25%{opacity:1;transform:scale(1.15)}60%{opacity:1;transform:scale(1)}100%{opacity:0}}
.bar{display:flex;padding:4px 6px 0}
.lk,.more,.tm{padding:0 12px}.lk{font-weight:700;margin-top:2px}.more{color:var(--mu);display:block;margin-top:2px}.tm{color:var(--mu);font-size:12px;margin-top:4px}
.btn{background:var(--ac);color:#fff;font-weight:700;border-radius:10px;padding:11px 18px}.btn.full{width:100%;margin-top:12px}
.empty{text-align:center;padding:56px 24px;color:var(--mu)}.empty h3{color:var(--tx);margin:0 0 6px;font-size:20px}
.sb{padding:10px 12px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.tile{aspect-ratio:1/1;padding:8px;display:grid;place-items:center;text-align:center;color:#fff;font-weight:700;font-size:13px;overflow:hidden;word-break:break-word}.tile.pl{background:var(--card);color:var(--tx);border:1px solid var(--ln)}
.prh{display:flex;align-items:center;gap:20px;padding:16px 16px 10px}
.stats{display:flex;flex:1;justify-content:space-around;text-align:center;font-size:13px;color:var(--mu)}.stats b{display:block;font-size:18px;color:var(--tx)}
.pn{padding:0 16px 12px;font-weight:700}
.tabs{display:flex;border-top:1px solid var(--ln)}.tabs button{flex:1;padding:12px;color:var(--mu);border-bottom:2px solid transparent}.tabs .on{color:var(--tx);border-color:var(--tx);font-weight:700}
.cr{padding:14px;display:flex;flex-direction:column;gap:12px}.cr h2{margin:0;font-size:18px}.cr textarea{min-height:170px;resize:vertical}
.cols{display:flex;gap:10px}.cols button{width:34px;height:34px;border-radius:50%;border:2px solid var(--ln)}.cols .sel{border-color:var(--tx);box-shadow:0 0 0 2px var(--bg) inset}
#modal{position:fixed;inset:0;background:rgba(10,6,16,.6);display:none;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--bg);width:100%;max-width:480px;max-height:88vh;overflow-y:auto;border-radius:18px 18px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
.sh2{display:flex;align-items:center;justify-content:space-between;padding:6px 6px 6px 16px;border-bottom:1px solid var(--ln);position:sticky;top:0;background:var(--bg);z-index:2}
.mi{display:block;width:100%;padding:16px;text-align:center;border-bottom:1px solid var(--ln)}.red{color:#e5384f;font-weight:700}
.cl{padding:8px 14px;min-height:120px}.cmt{display:flex;gap:10px;padding:8px 0}.cmt small{display:block;color:var(--mu)}.mu{color:var(--mu)}
.ci{display:flex;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--ln);position:sticky;bottom:0;background:var(--bg)}.acc{color:var(--ac);font-weight:700}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 74px);transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:20px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:40;white-space:nowrap}#toast.on{opacity:1}
.banner{margin:10px 12px;padding:10px 12px;border:1px solid var(--ln);border-radius:10px;color:var(--mu);font-size:13px}
@media (prefers-reduced-motion:reduce){.pop .hrt{animation-duration:.01ms}}
</style>
</head>
<body>
<header id="top"><span class="logo">Notes</span></header>
<main id="main"></main>
<nav id="nav"><div id="navb"></div></nav>
<div id="modal"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const ic=(n,f)=>`<svg viewBox="0 0 24 24" width="24" height="24" fill="${f?'currentColor':'none'}" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">${IC[n]}</svg>`;
const G=['','#ff3d6e,#ff9d2e','#7b2ff7,#ff3d6e','#0ea5e9,#7b2ff7','#10b981,#0ea5e9','#f59e0b,#ef4444'];
const ago=t=>{const s=(Date.now()-t)/1e3;return s<60?'Just now':s<3600?(s/60|0)+'m ago':s<86400?(s/3600|0)+'h ago':(s/86400|0)+'d ago'};
const hue=u=>[...String(u)].reduce((a,c)=>(a*31+c.charCodeAt(0))%3600,7)%360;
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2300)}

const D={notes:{},likes:{},comments:{},profiles:{},shares:{}};
let V={tab:'home',prof:null,pt:'notes',m:null,edit:null,draft:{title:'',body:'',c:1},pop:null};
const lk=c=>c==='notes'?'notes_local':'n_'+c;
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
for(const c in D)D[c].local=ld(lk(c),[]);
let SAVED=ld('n_saved',[]),SEEN=0,DL=location.hash.slice(1),ready=false;
try{SEEN=+localStorage.getItem('n_seen')||0}catch(e){}

const all=c=>Object.entries(D[c]).flatMap(([u,a])=>(a||[]).map(x=>({...x,u})));
const mine=c=>D[c][ME]||[];
const notes=()=>all('notes').sort((a,b)=>b.t-a.t);
const NB=id=>notes().find(n=>n.id===id);
const likesOf=id=>Object.keys(D.likes).filter(u=>(D.likes[u]||[]).includes(id));
const cm=id=>all('comments').filter(c=>c.p===id).sort((a,b)=>a.t-b.t);
const pname=u=>((D.profiles[u]||[])[0]||{}).name||'';
const myName=()=>pname(ME);
const nm=u=>pname(u)||(u==='local'?'You':NAMES[u]||(u===ME?'You':'Someone'));
const inbox=()=>all('shares').filter(s=>s.to===ME).sort((a,b)=>b.t-a.t);
const seen=()=>{SEEN=inbox().length;try{localStorage.setItem('n_seen',SEEN)}catch(e){}};

const picOf=u=>((D.profiles[u]||[])[0]||{}).pic||DEF;
const avImg=(src,s)=>`<img class="av" alt="" src="${src}" style="width:${s}px;height:${s}px;object-fit:cover;background:var(--card)">`;
const shareTxt=n=>(n.title?n.title+'\n':'')+n.body+'\n\n— '+nm(n.u)+' on Notes'+(LINK?'\n'+LINK+'#'+n.id:'');
const chk=()=>{if(ready&&!myName()&&(!V.m||V.m.t==='open')){if(V.m)DL=V.m.id;V.m={t:'acct'};modal()}};
const deep=()=>{if(DL&&NB(DL)&&!V.m){const id=DL;DL='';V.m={t:'open',id};modal()}};
const inb=()=>{const k=inbox().length-SEEN;return k>0?`<button class="banner" style="display:block;width:calc(100% - 24px);text-align:left;color:var(--tx)" data-act="inbox"><b>${k} new</b> note${k==1?'':'s'} shared with you · View</button>`:''};
function save(c,items){D[c][ME]=items;render();
  if(online)DB.doc(c+'/'+ME).set({items}).catch(e=>toast(e&&e.code==='quota_exceeded'?'Storage is full':'Could not save that'));
  else{try{localStorage.setItem(lk(c),JSON.stringify(items))}catch(e){}}}
function saveSaved(){try{localStorage.setItem('n_saved',JSON.stringify(SAVED))}catch(e){}}

const av=(u,s)=>avImg(picOf(u),s);
const bg=c=>c?`background:linear-gradient(135deg,${G[c]})`:'';
function post(n){const id=n.id,l=likesOf(id),liked=l.includes(ME),sv=SAVED.includes(id),k=cm(id).length;
 return `<article class="post"><div class="ph"><button class="who" data-act="prof" data-u="${esc(n.u)}">${av(n.u,34)}<b>${esc(nm(n.u))}</b></button>${n.u===ME?`<button class="ic" data-act="menu" data-id="${id}" aria-label="Note options">${ic('dots')}</button>`:''}</div>
<div class="nc${n.c?' g':''}" style="${bg(n.c)}" data-id="${id}">${n.title?`<h3>${esc(n.title)}</h3>`:''}<p>${esc(n.body)}</p><span class="hrt">${ic('heart',1)}</span></div>
<div class="bar"><button class="ic${liked?' on':''}" data-act="like" data-id="${id}" aria-label="Like">${ic('heart',liked)}</button><button class="ic" data-act="cmt" data-id="${id}" aria-label="Comments">${ic('comment')}</button><button class="ic" data-act="share" data-id="${id}" aria-label="Share">${ic('send')}</button><button class="ic sv${sv?' on':''}" data-act="save" data-id="${id}" aria-label="Save">${ic('bookmark',sv)}</button></div>
<div class="lk">${l.length} like${l.length==1?'':'s'}</div>
${k?`<button class="more" data-act="cmt" data-id="${id}">${k==1?'View 1 comment':'View all '+k+' comments'}</button>`:''}
<div class="tm">${ago(n.t)}${n.e?' · edited':''}</div></article>`}
const tile=n=>`<button class="tile${n.c?'':' pl'}" style="${bg(n.c)}" data-act="open" data-id="${n.id}">${esc((n.title||n.body).slice(0,70))}</button>`;
const empty=(h,p)=>`<div class="empty"><h3>${h}</h3><p>${p}</p></div>`;
const banner=()=>online?'':'<div class="banner">Not signed in to claude.ai, so notes are saved on this device only. Sign in to post notes others can see.</div>';

function home(){const l=notes();return banner()+inb()+(l.length?l.map(post).join(''):empty('No notes yet','Tap the + below to post the first one.'))}
function explore(){return `<div class="sb"><input id="q" placeholder="Search notes or people" aria-label="Search"></div><div class="grid" id="res">${results('')}</div>`}
function results(q){q=q.toLowerCase();const l=notes().filter(n=>!q||(n.title+' '+n.body+' '+nm(n.u)).toLowerCase().includes(q));return l.length?l.map(tile).join(''):'<div style="grid-column:1/-1">'+empty('Nothing found','Try different words.')+'</div>'}
function create(){const d=V.draft;return `<div class="cr"><h2>${V.edit?'Edit note':'New note'}</h2><input id="nt" placeholder="Title (optional)" maxlength="80" value="${esc(d.title)}"><textarea id="nb" placeholder="Write your note…" maxlength="2000">${esc(d.body)}</textarea>
<div class="cols">${G.map((g,i)=>`<button data-act="col" data-c="${i}" class="${i===d.c?'sel':''}" aria-label="Color ${i+1}" style="${i?bg(i):'background:var(--card)'}"></button>`).join('')}</div>
<button class="btn" data-act="submit">${V.edit?'Save changes':'Post note'}</button>${V.edit?'<button class="mu" data-act="cancel">Cancel</button><button class="red" data-act="del" data-id="'+V.edit+'">Delete note</button>':''}</div>`}
function profile(){const u=V.prof||ME,own=u===ME,my=notes().filter(n=>n.u===u),lt=my.reduce((a,n)=>a+likesOf(n.id).length,0);
 const list=own&&V.pt==='saved'?SAVED.map(NB).filter(Boolean):own&&V.pt==='shared'?inbox().map(s=>NB(s.nid)).filter(Boolean):my;
 return `<div class="prh">${av(u,80)}<div class="stats"><div><b>${my.length}</b>notes</div><div><b>${lt}</b>likes</div></div></div><div class="pn">${esc(nm(u))}${own?' <button class="acc" data-act="acct" style="font-weight:400;margin-left:8px">Edit name</button>':''}</div>
${own?`<div class="tabs"><button class="${V.pt==='notes'?'on':''}" data-act="pt" data-p="notes">My notes</button><button class="${V.pt==='saved'?'on':''}" data-act="pt" data-p="saved">Saved</button><button class="${V.pt==='shared'?'on':''}" data-act="pt" data-p="shared">Shared${inbox().length?' ('+inbox().length+')':''}</button></div>`:'<div class="tabs"><button class="on">Notes</button></div>'}
${list.length?`<div class="grid">${list.map(tile).join('')}</div>`:empty(own&&V.pt==='shared'?'Nothing shared yet':V.pt==='saved'&&own?'Nothing saved':'No notes yet',own?'Notes you write or save show up here.':'')}`}

function render(soft){
  if(!(soft&&V.tab==='create')){
    const d=$('#nt');if(d)V.draft={...V.draft,title:d.value,body:$('#nb').value};
    $('#main').innerHTML={home,explore,create,profile}[V.tab]();
    if(V.pop){document.querySelectorAll(`.nc[data-id="${V.pop}"]`).forEach(e=>e.classList.add('pop'));V.pop=null}
  }
  document.querySelectorAll('#navb button').forEach(b=>b.classList.toggle('on',b.dataset.tab===V.tab));
  modal();
}
function setM(m){$('#modal').innerHTML='';V.m=m;modal()}
function cmList(id){const l=cm(id);return l.length?l.map(c=>`<div class="cmt">${av(c.u,30)}<div><b>${esc(nm(c.u))}</b> ${esc(c.text)}<small>${ago(c.t)}</small></div></div>`).join(''):'<p class="mu">No comments yet. Start the conversation.</p>'}
function modal(){const m=V.m,el=$('#modal');
  if(!m){el.style.display='none';el.innerHTML='';return}
  const x=`<button class="ic" data-act="mclose" aria-label="Close">${ic('x')}</button>`;
  if(m.t==='cm'){if($('#cl')){$('#cl').innerHTML=cmList(m.id);return}
    el.innerHTML=`<div class="sheet"><div class="sh2"><b>Comments</b>${x}</div><div class="cl" id="cl">${cmList(m.id)}</div><div class="ci"><input id="ci" placeholder="Add a comment…" maxlength="300"><button class="acc" data-act="cpost">Post</button></div></div>`}
  else if(m.t==='acct'){if($('#an'))return;const nv=myName();
    el.innerHTML=`<div class="sheet"><div class="sh2"><b>${nv?'Edit name':'Create your account'}</b>${nv?x:''}</div><div class="cr"><p class="mu" style="margin:0">${nv?'Change the name shown on your notes.':'Pick the name people will see on your notes and comments, and when you send them a note.'}</p><div class="who" style="gap:14px"><span id="ap0">${av(ME,64)}</span><button class="acc" data-act="pickpic">Change photo</button><input id="ap" type="file" accept="image/*" style="display:none"></div><input id="an" placeholder="Your name" maxlength="30" autocomplete="name" value="${esc(nv)}"><button class="btn" data-act="asave">${nv?'Save':'Create account'}</button></div></div>`;
    setTimeout(()=>{const i=$('#an');if(i)i.focus()},60)}
  else if(m.t==='share'){const n=NB(m.id);if(!n){V.m=null;return modal()}
    const ppl=online?[...new Set(all('profiles').map(p=>p.u))].filter(u=>u!==ME&&pname(u)):[],sent=mine('shares').filter(s=>s.nid===m.id).map(s=>s.to);
    el.innerHTML=`<div class="sheet"><div class="sh2"><b>Share note</b>${x}</div><button class="mi" data-act="sys" data-id="${m.id}">Share via…</button><button class="mi" data-act="copy" data-id="${m.id}">${LINK?'Copy link':'Copy note'}</button>${online?`<div class="mu" style="padding:14px 16px 4px;font-size:13px">Send to someone on Notes</div>${ppl.length?ppl.map(u=>`<button class="mi" data-act="sendto" data-id="${m.id}" data-u="${esc(u)}" ${sent.includes(u)?'disabled':''}>${esc(nm(u))}${sent.includes(u)?' · Sent':''}</button>`).join(''):'<p class="mu" style="padding:6px 16px 16px;margin:0">Nobody else has created an account yet. Send them the link and ask them to sign up.</p>'}`:''}</div>`}
  else if(m.t==='confirm')el.innerHTML=`<div class="sheet"><div class="sh2"><b>Delete this note?</b>${x}</div><p class="mu" style="padding:12px 16px;margin:0">This removes it for everyone and can’t be undone.</p><button class="mi red" data-act="delok" data-id="${m.id}">Delete</button><button class="mi" data-act="mclose">Cancel</button></div>`;
  else if(m.t==='menu')el.innerHTML=`<div class="sheet"><button class="mi" data-act="edit" data-id="${m.id}">Edit</button><button class="mi red" data-act="del" data-id="${m.id}">Delete</button><button class="mi" data-act="mclose">Cancel</button></div>`;
  else{const n=NB(m.id);if(!n){V.m=null;return modal()}el.innerHTML=`<div class="sheet"><div class="sh2"><b></b>${x}</div>${post(n)}</div>`}
  el.style.display='flex'}

function like(id,only){const l=[...mine('likes')],i=l.indexOf(id);
  if(i>=0){if(only){V.pop=id;render();return}l.splice(i,1)}else{l.push(id);V.pop=id}save('likes',l)}
function go(tab,u){V.tab=tab;V.prof=u||null;V.m=null;if(tab!=='create'&&V.edit){V.edit=null;V.draft={title:'',body:'',c:1}}scrollTo(0,0);render()}

document.addEventListener('click',async e=>{
  const t=e.target;
  if(t.id==='modal'){if(V.m&&V.m.t==='acct'&&!myName())return;V.m=null;modal();return}
  const nc=t.closest('.nc');
  if(nc){const id=nc.dataset.id,now=Date.now();if(LT.id===id&&now-LT.t<350){LT={};like(id,true)}else LT={id,t:now};return}
  const b=t.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,id=b.dataset.id;
  if(a==='tab')go(b.dataset.tab);
  else if(a==='prof'){go('profile',b.dataset.u===ME?null:b.dataset.u)}
  else if(a==='pt'){V.pt=b.dataset.p;if(V.pt==='shared')seen();render()}
  else if(a==='like')like(id);
  else if(a==='cmt')setM({t:'cm',id});
  else if(a==='open')setM({t:'open',id});
  else if(a==='menu')setM({t:'menu',id});
  else if(a==='mclose'){V.m=null;modal()}
  else if(a==='save'){const i=SAVED.indexOf(id);i>=0?SAVED.splice(i,1):SAVED.unshift(id);saveSaved();toast(i>=0?'Removed from saved':'Saved');render()}
  else if(a==='share')setM({t:'share',id});
  else if(a==='sys'){const n=NB(id);try{if(navigator.share)await navigator.share({text:shareTxt(n)});else{await navigator.clipboard.writeText(shareTxt(n));toast('Copied')}}catch(x){}}
  else if(a==='copy'){const n=NB(id);try{await navigator.clipboard.writeText(shareTxt(n));toast('Copied');V.m=null;modal()}catch(x){toast('Could not copy')}}
  else if(a==='sendto'){const u=b.dataset.u;save('shares',[...mine('shares'),{id:Date.now().toString(36),nid:id,to:u,t:Date.now()}]);toast('Sent to '+nm(u))}
  else if(a==='acct')setM({t:'acct'});
  else if(a==='pickpic')$('#ap').click();
  else if(a==='inbox'){seen();V.pt='shared';go('profile')}
  else if(a==='asave'){const v=$('#an').value.trim().replace(/\s+/g,' ');if(v.length<2){toast('Enter your name');return}const first=!myName();V.m=null;save('profiles',[{name:v,pic:PIC||(mine('profiles')[0]||{}).pic||''}]);PIC='';toast(first?'Welcome, '+v:'Name updated');deep()}
  else if(a==='col'){V.draft={title:$('#nt').value,body:$('#nb').value,c:+b.dataset.c};render()}
  else if(a==='edit'){const n=NB(id);V.edit=id;V.draft={title:n.title||'',body:n.body,c:n.c||0};go('create');V.edit=id;render()}
  else if(a==='cancel')go('home');
  else if(a==='del')setM({t:'confirm',id});
  else if(a==='delok'){V.m=null;if(V.edit===id){V.edit=null;V.draft={title:'',body:'',c:1};V.tab='home'}SAVED=SAVED.filter(x=>x!==id);saveSaved();save('notes',mine('notes').filter(n=>n.id!==id));toast('Note deleted')}
  else if(a==='submit'){
    const title=$('#nt').value.trim(),body=$('#nb').value.trim();
    if(!body){toast('Write something first');return}
    const items=[...mine('notes')];
    if(V.edit){const i=items.findIndex(n=>n.id===V.edit);if(i>=0)items[i]={...items[i],title,body,c:V.draft.c,e:1}}
    else items.unshift({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),title,body,c:V.draft.c,t:Date.now()});
    const was=V.edit;V.edit=null;V.draft={title:'',body:'',c:1};V.tab='home';save('notes',items);scrollTo(0,0);toast(was?'Note updated':'Posted')}
  else if(a==='cpost'){const i=$('#ci'),text=i.value.trim();if(!text)return;
    save('comments',[...mine('comments'),{id:Date.now().toString(36),p:V.m.id,text,t:Date.now()}]);i.value=''}
});
document.addEventListener('input',e=>{if(e.target.id==='q')$('#res').innerHTML=results(e.target.value)});
document.addEventListener('change',e=>{if(e.target.id!=='ap')return;const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),s=144,m=Math.min(im.width,im.height);c.width=c.height=s;c.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,s,s);PIC=c.toDataURL('image/jpeg',.8);$('#ap0').innerHTML=avImg(PIC,64)};im.src=r.result};r.readAsDataURL(f)});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='an'){e.preventDefault();$('[data-act="asave"]').click()}if(e.key==='Enter'&&e.target.id==='ci'){e.preventDefault();document.querySelector('[data-act="cpost"]').click()}});
$('#navb').innerHTML=[['home','Home'],['explore','Search'],['create','New note'],['profile','Profile']].map(([t,l],i)=>`<button data-act="tab" data-tab="${t}" aria-label="${l}">${ic(['home','search','plus','user'][i])}</button>`).join('');

async function resolveNames(){
  if(!USER)return;
  try{const ids=[...new Set(['notes','likes','comments'].flatMap(c=>Object.keys(D[c])).concat(ME))];
    const ps=await USER.profiles(ids);for(const id of ids)NAMES[id]=(ps[id]&&ps[id].name)||'';render(true)}catch(e){}
}
render();
(async()=>{
  try{
    if(!window.claude||!claude.use)return;
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!db||!user)return;
    const id=await user.id();if(!id)return;
    DB=db;USER=user;ME=id;online=true;
    for(const c of ['notes','likes','comments','profiles','shares'])DB.collection(c).onSnapshot(snap=>{
      D[c]={};snap.docs.forEach(d=>{const x=d.data();if(x&&Array.isArray(x.items))D[c][d.id]=x.items});
      render(true);resolveNames();deep();if(c==='profiles'){ready=true;chk()}
    },()=>{});
    render(true);
  }catch(e){}finally{if(!online){ready=true;chk();deep()}}
})();
</script>
</body>
</html>
